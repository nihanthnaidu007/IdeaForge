# IdeaForge web tier: SPA static serving + /api reverse proxy (compose: web→api).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed Vite assets are immutable; the shell (index.html) is never cached.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Appends the client address to X-Forwarded-For — pair with backend
  # TRUSTED_PROXY=true so the auth limiter keys on the rightmost hop.
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # SPA fallback: client-side routes resolve through index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
