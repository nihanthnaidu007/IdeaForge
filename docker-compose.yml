# IdeaForge self-hosting stack (spec §Deploy): FastAPI api + nginx web + mongo:7.
# Optional shared-rate-limit redis: `docker compose --profile redis up -d`.
# Required env: cp backend/.env.example backend/.env, then set JWT_SECRET and
# ENCRYPTION_MASTER_KEY (openssl rand -base64 32). MONGO_URL is forced to the
# compose-internal hostname here regardless of what a copied .env carries.
services:
  api:
    build: ./backend
    env_file:
      - "${API_ENV_FILE:-backend/.env}"
    environment:
      MONGO_URL: mongodb://mongo:27017
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "3000:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles:
      - redis
    restart: unless-stopped

volumes:
  mongo-data:
