name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Full backend requirements land with the app-restructure PR (the current
      # scaffold tree pins an uninstallable scaffold package); the smoke suite is
      # stdlib-only, so CI stays fast and honest until then.
      - name: Install lint + test tools
        run: pip install ruff==0.16.8 pytest

      # Scoped to tests/ while backend/server.py is still scaffold-owned;
      # the restructure PR extends this to the backend package.
      - name: Ruff
        run: ruff check tests/

      - name: Pytest
        run: pytest tests/ -q

  frontend:
    name: Frontend (scaffold gate + vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails on committed secrets or scaffold strings outside
      # sibling-PR-owned paths. Runs first so violations surface in seconds.
      - name: Secrets & scaffold grep gate
        run: bash scripts/ci/scaffold-gate.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # .npmrc sets legacy-peer-deps for the remaining legacy CRA deps
      # (react 19 + react-day-picker 8 peer conflict); the dependency-diet
      # commit removes it.
      - name: Install
        run: npm ci
        working-directory: frontend

      - name: Test (vitest)
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      # The Vite entry must ship clean and split: zero Emergent/PostHog
      # strings in the built output, and more than one JS chunk (route-level
      # code splitting — no monolith).
      - name: Dist hygiene gate
        run: |
          if grep -riE "emergent|posthog" frontend/dist; then
            echo "FAIL: dist/ contains Emergent/PostHog strings"
            exit 1
          fi
          js_count=$(find frontend/dist -name '*.js' | wc -l)
          if [ "$js_count" -lt 2 ]; then
            echo "FAIL: expected route-split chunks in dist/, found $js_count JS file(s)"
            exit 1
          fi
          echo "dist/ clean ($js_count JS chunks)."
